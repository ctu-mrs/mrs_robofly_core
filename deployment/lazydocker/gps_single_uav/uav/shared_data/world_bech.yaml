mrs_uav_managers:

  world_origin:

    units: "LATLON" # {"UTM, "LATLON"}

    # cisar race track
    # origin_x: 50.091222 #458422.2
    # origin_y: 14.633583 #5551241.4
    origin_x: 50.0905466
    origin_y: 14.6343125

    # # mezi stromy a lampou
    # origin_x: 458383.0
    # origin_y: 5551267.0

    # # mezi krtinci
    # origin_x: 458326
    # origin_y: 5551249

  safety_area_manager:

    safety_area:

      enabled: true

      horizontal:

        # the frame of reference in which the points are expressed
        frame_name: "world_origin"

        # polygon
        #
        # x, y [m] for any frame_name except latlon_origin
        # x = latitude, y = longitude [deg]  for frame_name=="latlon_origin"
        points: [
          30.0, 30.0,
          -30.0, 30.0,
          -30.0, -30.0,
          30.0, -30.0,
        ]

        # # race track extended
        # points: [
        #   44.8, -26.4,
        #   31.8, 25.6,
        #   -112.2, -0.4,
        #   -48.2, -48.4,
        # ]

        # # mezi stromy a lampou
        # points: [
        #   10.0, 10.0,
        #   -10.0, 10.0,
        #   -10.0, -10.0,
        #   10.0, -10.0,
        # ]

        # # mezi krtinci
        # points: [
        #   -8, -43,
        #   52, -54,
        #   42, 4,
        #   14, 20,
        #   -26, 15,
        #   -32, -26,
        # ]

      vertical:

        # the frame of reference in which the max&min z is expressed
        frame_name: "world_origin"

        max_z: 25.0
        min_z: 1.0

      obstacles:

        present: false
