name: docker
root: ./
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
startup_window: lazydocker
pre_window: export UAV_NAME=uav67
windows:
  - lazydocker:
      layout: 6102,174x53,0,0[174x38,0,0,0,174x14,0,39,5]
      panes:
        - export DOCKER_HOST=tcp://uav64:2375; lazydocker
        - export UAV_NAME=uav64; ros2 run mrs_uav_status status.sh
        - export DOCKER_HOST=tcp://uav67:2375; lazydocker
        - export UAV_NAME=uav67; ros2 run mrs_uav_status status.sh
  - compose:
      layout: tiled
      panes:
        - export DOCKER_HOST=tcp://uav64:2375; cd stacks/stack64 && ./up.sh
        - export DOCKER_HOST=tcp://uav67:2375; cd stacks/stack67 && ./up.sh
  - workspace:
      layout: tiled
      panes:
        - cd ./colcon_workspace_builder
  - rviz:
      layout: tiled
      panes:
        - ros2 run rviz2 rviz2 -d ./config.rviz
  - zenoh_router:
      layout: tiled
      panes:
        - export ZENOH_ROUTER_CONFIG_URI=./zenoh_router.json5; ros2 run rmw_zenoh_cpp rmw_zenohd
